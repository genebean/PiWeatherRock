    <text x="540" y="220" font-size="32">Humedad 54%</text>
    <text x="540" y="276" font-size="30">No hace falta paraguas</text>
    <text x="128" y="345" font-size="34" text-anchor="middle">Hoy</text>
    <text x="128" y="430" font-size="54" text-anchor="middle">☀</text>
    <text x="128" y="505" font-size="34" text-anchor="middle">24° / 13°</text>
    <text x="384" y="345" font-size="34" text-anchor="middle">Viernes</text>
    <text x="384" y="430" font-size="54" text-anchor="middle">☁</text>
    <text x="384" y="505" font-size="34" text-anchor="middle">22° / 12°</text>
    <text x="640" y="345" font-size="34" text-anchor="middle">Sábado</text>
    <text x="640" y="430" font-size="54" text-anchor="middle">☂</text>
    <text x="640" y="505" font-size="34" text-anchor="middle">19° / 11°</text>
    <text x="896" y="345" font-size="34" text-anchor="middle">Domingo</text>
    <text x="896" y="430" font-size="54" text-anchor="middle">☀</text>
