<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600" role="img" aria-labelledby="title desc">
  <title id="title">Captura representativa de la previsión diaria de PiWeatherRock</title>
  <desc id="desc">Pantalla negra con bordes blancos, hora, temperatura actual, condiciones y previsión de cuatro días.</desc>
  <rect width="1024" height="600" fill="#000"/>
  <g stroke="#fff" stroke-width="5" fill="none">
    <rect x="10" y="2" width="1012" height="596"/>
    <line x1="10" y1="90" x2="1022" y2="90"/>
    <line x1="10" y1="300" x2="1022" y2="300"/>
    <line x1="512" y1="90" x2="512" y2="598"/>
    <line x1="256" y1="300" x2="256" y2="598"/>
    <line x1="768" y1="300" x2="768" y2="598"/>
  </g>
  <g fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">
    <text x="512" y="64" font-size="64" text-anchor="middle">14:02 hr</text>
    <text x="270" y="226" font-size="130" text-anchor="middle">21° C</text>
    <text x="270" y="276" font-size="30" text-anchor="middle">Parcialmente nuboso</text>
    <text x="540" y="140" font-size="32">Sensación 22° C</text>
